<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AcompañAR - Nueva contraseña</title>

    <link rel="stylesheet" href="css/Style.css">
</head>

<body>
    <main class="registro-container">
        <section class="registro-card login-card"
                 aria-labelledby="nueva-password-titulo">

            <div class="logo">
                <div class="logo-icon" aria-hidden="true">💜</div>
                <h1>AcompañAR</h1>
                <p>Recordar. Acompañar. Proteger.</p>
            </div>

            <div class="registro-header login-header">
                <h2 id="nueva-password-titulo">Creá una nueva contraseña</h2>
                <p>Elegí una contraseña segura para volver a ingresar a tu cuenta.</p>
            </div>

            <form id="nuevaPasswordForm">
                <div class="form-group">
                    <label for="password">Nueva contraseña</label>
                    <input type="password"
                           id="password"
                           name="password"
                           minlength="8"
                           maxlength="16"
                           autocomplete="new-password"
                           placeholder="Entre 8 y 16 caracteres"
                           required>
                </div>

                <div class="form-group">
                    <label for="confirmarPassword">Confirmar contraseña</label>
                    <input type="password"
                           id="confirmarPassword"
                           name="confirmarPassword"
                           minlength="8"
                           maxlength="16"
                           autocomplete="new-password"
                           placeholder="Repetí la nueva contraseña"
                           required>
                </div>

                <button type="submit" class="btn-registrar">
                    Restablecer contraseña
                </button>

                <p id="nuevaPasswordMensaje"
                   class="login-link"
                   role="status"
                   aria-live="polite"></p>
            </form>

            <p class="login-link">
                <a href="login.html">Volver a iniciar sesión</a>
            </p>
        </section>
    </main>
    <script src="js/nueva-password.js"></script>
</body>
</html>
